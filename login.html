<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — TravelDuckling</title>
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="logo-mark.png" type="image/png">
<style>
  :root { color-scheme: light; --yellow: #ffcc33; --ink: #0d1526; --muted: #64748b; --shell: min(1120px, 100% - 2.5rem); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; min-height: 100vh; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: #0b1220; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #0b1220; }
  .backdrop__photo { position: absolute; inset: -4%; background: url("image_background.webp") center / cover no-repeat; filter: saturate(.86); }
  .backdrop__scrim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(11,18,32,.28), rgba(11,18,32,.76) 76%), linear-gradient(180deg, rgba(11,18,32,.45), rgba(11,18,32,.66)); }
  .site-header { width: var(--shell); margin-inline: auto; padding-block: 1.25rem; display: flex; align-items: center; }
  .brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; color: #fff; }
  .brand img { height: 46px; width: auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  .brand__name { font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; }
  .brand__name span { color: var(--yellow); }
  .back-link { margin-left: auto; padding: .55rem .85rem; border-radius: 999px; color: rgba(255,255,255,.9); text-decoration: none; font-size: .92rem; }
  .back-link:hover { background: rgba(255,255,255,.12); }
  main { min-height: calc(100vh - 78px); display: grid; place-items: center; padding: 1.5rem 1.25rem 4rem; }
  .login-card { width: min(100%, 450px); padding: clamp(1.6rem, 6vw, 2.65rem); border: 1px solid rgba(255,255,255,.64); border-radius: 24px; background: rgba(255,255,255,.96); box-shadow: 0 24px 70px rgba(0,0,0,.34); }
  .eyebrow { display: inline-flex; align-items: center; gap: .45rem; margin: 0 0 .85rem; color: #8a6410; font-size: .78rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 4px rgba(255,204,51,.2); }
  h1 { margin: 0; font-size: clamp(2rem, 7vw, 2.55rem); line-height: 1.08; letter-spacing: -.045em; }
  .intro { margin: .75rem 0 1.8rem; color: var(--muted); line-height: 1.55; }
  .field { display: grid; gap: .48rem; margin-top: 1.1rem; }
  .field label { font-size: .9rem; font-weight: 650; }
  .field input { width: 100%; min-height: 3.15rem; border: 1px solid #d5dce6; border-radius: 11px; padding: .75rem .9rem; background: #fff; color: var(--ink); }
  .field input::placeholder { color: #94a0b2; }
  .field input:focus { outline: 3px solid rgba(255,204,51,.38); border-color: #d99a10; }
  .form-row { display: flex; justify-content: flex-end; margin: .8rem 0 1.3rem; }
  .text-link { color: #77570d; font-size: .88rem; font-weight: 650; text-decoration: none; }
  .text-link:hover { text-decoration: underline; }
  .submit { width: 100%; min-height: 3.2rem; border: 0; border-radius: 999px; background: var(--yellow); color: var(--ink); font-weight: 750; cursor: pointer; transition: transform .16s ease, background-color .16s ease; }
  .submit:hover { background: #ffd95f; transform: translateY(-1px); }
  .status { min-height: 1.4rem; margin: .8rem 0 0; color: #526177; font-size: .87rem; line-height: 1.4; }
  .signup { margin: 1.2rem 0 0; text-align: center; color: var(--muted); font-size: .9rem; }
  .signup a { margin-left: .2rem; }
  .divider { display: flex; align-items: center; gap: .8rem; margin: 1.25rem 0 0; color: #8792a3; font-size: .78rem; }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #e4e8ee; }
  @media (max-width: 480px) { .site-header { padding-block: .85rem; } .brand img { height: 39px; } .brand__name { font-size: 1.05rem; } main { align-items: start; padding-top: 2.1rem; } .login-card { border-radius: 20px; } }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="backdrop__photo"></div><div class="backdrop__scrim"></div></div>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TravelDuckling home">
      <img src="logo-mark.png" alt="" width="371" height="325">
      <span class="brand__name">Travel<span>Duckling</span></span>
    </a>
    <a class="back-link" href="index.html">← Back to trips</a>
  </header>
  <main>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Log in to your account</h1>
      <p class="intro">Pick up where your next adventure starts.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
        <div class="form-row"><a class="text-link" id="forgot-password-link" href="#forgot-password">Forgot password?</a></div>
        <button class="submit" type="submit">Log in</button>
        <p class="status" id="login-status" role="status" aria-live="polite"></p>
      </form>
      <div class="divider" aria-hidden="true">Your next trip is waiting</div>
      <p class="signup">New to TravelDuckling? <a class="text-link" href="signup.html">Create an account</a></p>
    </section>
  </main>
  <script type="module">
    import {
      auth, authErrorMessage, sendEmailVerification, sendPasswordResetEmail,
      signInWithEmailAndPassword, signOut
    } from "./firebase-auth.js";

    const form = document.getElementById("login-form");
    const status = document.getElementById("login-status");
    const submit = form.querySelector("button[type=submit]");
    const emailField = document.getElementById("email");
    const nextParam = new URLSearchParams(location.search).get("next");
    const nextUrl = new URL(nextParam || "index.html", location.href);
    const returnTo = nextUrl.origin === location.origin
      ? `${nextUrl.pathname}${nextUrl.search}${nextUrl.hash}`
      : "index.html";

    document.getElementById("forgot-password-link").addEventListener("click", async (event) => {
      event.preventDefault();
      if (!emailField.value.trim()) {
        status.textContent = "Enter your email address first, then choose Forgot password again.";
        emailField.focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, emailField.value.trim());
        status.textContent = "If an account exists for that email, a password reset link has been sent.";
      } catch (error) {
        status.textContent = authErrorMessage(error);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      submit.disabled = true;
      submit.textContent = "Signing in…";
      try {
        const credential = await signInWithEmailAndPassword(
          auth, emailField.value.trim(), document.getElementById("password").value
        );
        if (!credential.user.emailVerified) {
          await sendEmailVerification(credential.user);
          await signOut(auth);
          status.textContent = "Verify your email using the link we just sent, then log in.";
          return;
        }
        location.assign(returnTo);
      } catch (error) {
        status.textContent = authErrorMessage(error);
      } finally {
        submit.disabled = false;
        submit.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
