<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — TravelDuckling</title>
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="../assets/images/logo-mark.png" type="image/png">
<link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="backdrop__photo"></div><div class="backdrop__scrim"></div></div>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="TravelDuckling home">
      <img src="../assets/images/logo-mark.png" alt="" width="371" height="325">
      <span class="brand__name">Travel<span>Duckling</span></span>
    </a>
    <a class="back-link" href="../index.html">← Back to trips</a>
  </header>
  <main>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Log in to your account</h1>
      <p class="intro">Pick up where your next adventure starts.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
        <div class="form-row"><a class="text-link" id="forgot-password-link" href="#forgot-password">Forgot password?</a></div>
        <button class="submit" type="submit">Log in</button>
        <p class="status" id="login-status" role="status" aria-live="polite"></p>
      </form>
      <div class="divider" aria-hidden="true">Your next trip is waiting</div>
      <p class="signup">New to TravelDuckling? <a class="text-link" href="signup.html">Create an account</a></p>
    </section>
  </main>
  <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
