<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelDuckling</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        /* Background and Animation Container */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('image_background.webp');
            background-size: cover;
            background-position: center;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: rotateStars 60s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateStars {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .duckling-overlay {
            width: 200px;
            height: 200px;
            margin: 0 auto 1.5rem;
        }

        .duckling-overlay img {
            max-width: 100%;
            height: auto;
            border-radius: 50%;
        }

        /* Static Duck in bottom right */
        .static-duck {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px;
            z-index: 2;
        }

        .static-duck img {
            width: 100%;
            height: auto;
        }

        p {
            font-size: 1.1rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="background-container"></div>
    <div class="stars"></div>

    <div class="container">
        <h1>TravelDuckling</h1>
        <div class="duckling-overlay">
            <img src="duckling.png" alt="Travel Duckling">
        </div>
        <p>Your journey, shared.</p>
    </div>

    <div class="static-duck">
        <img src="duck.png" alt="Static Duck">
    </div>
</body>
</html>
